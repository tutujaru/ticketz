location / {
    try_files $uri $uri/ /index.html;
    include include.d/nocache.conf;
}

location = /maintenance.json {
    alias /var/www/public/maintenance.json;
    default_type application/json;
    add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
    add_header Pragma 'no-cache' always;
    expires -1;
}

location /static {
   alias /var/www/public/static/;
   include include.d/allcache.conf;
}

location /manifest.json {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://backend:3000/manifest.json;
}

location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Public protocol endpoints must reach the API. This location must be
# more specific than the static /backend/public/ file location below.
location /backend/public/protocol/ {
    rewrite ^/backend/(.*) /$1 break;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://backend:3000;
}

# Webchat público é uma API; deve ser encaminhado ao Express antes
# da localização de arquivos públicos abaixo.
location /backend/public/webchat/ {
    rewrite ^/backend/(.*) /$1 break;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://backend:3000;
}

location /backend/public/ {
    alias /var/www/backend-public/;
    include include.d/allcache.conf;
    set $content_disposition 'attachment';
    if ($arg_inline = 1) {
        set $content_disposition 'inline';
    }
    add_header Content-Disposition $content_disposition;
}

location /backend/ {
    rewrite ^/backend/(.*) /$1 break;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://backend:3000;
}

include ticketz.d/*.conf;

include "include.d/spa.conf";
